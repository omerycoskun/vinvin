# Vın Vın 3D (Unity) → iOS → TestFlight, tamamen ücretsiz GitHub Actions ile.
#  1) Ubuntu + GameCI: Unity projesinden iOS Xcode projesi üretir (Unity Personal lisansı).
#  2) macOS: diğer oyunlarda Codemagic'te çalışan AYNI imza yöntemiyle (codemagic-cli-tools,
#     kalıcı sertifika anahtarı + App Store Connect API anahtarı) IPA üretir ve TestFlight'a yükler.
#
# Gerekli repo secret'ları (Settings → Secrets and variables → Actions):
#   UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
#   APP_STORE_CONNECT_PRIVATE_KEY   (AuthKey_97HY5S2F6M.p8 içeriği)
#   APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
#   CERTIFICATE_PRIVATE_KEY          (Desktop/codemagic_ios_private_key.txt içeriği)

name: iOS TestFlight

on:
  push:
    branches: [unity3d]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.84f1
  BUNDLE_ID: com.omeryigitcoskun.vinvin

jobs:
  unity-export:
    name: Unity → Xcode projesi
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Disk alanı aç (Unity imajı büyük)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/checkout@v4

      - name: Library önbelleği
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-

      - name: Build numarası
        run: echo "BUILD_NUMBER=$(date +%s)" >> "$GITHUB_ENV"

      - name: Unity iOS export
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: VinVin.EditorTools.VinVinBuild.BuildiOS
          buildsPath: build
          buildName: iOS
          customParameters: -buildNumber ${{ env.BUILD_NUMBER }}
          allowDirtyBuild: true

      - name: Xcode projesini paketle
        run: |
          sudo chown -R "$USER" build
          echo "$BUILD_NUMBER" > build/iOS/iOS/BUILD_NUMBER
          tar -czf xcode.tgz -C build/iOS iOS

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode.tgz
          retention-days: 3

  ios-testflight:
    name: İmzala + TestFlight
    needs: unity-export
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Aç
        run: tar -xzf xcode.tgz

      - name: Xcode seç
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: codemagic-cli-tools
        run: pip3 install --break-system-packages codemagic-cli-tools

      - name: İmzalama (kalıcı sertifika anahtarı ile sertifika + profil)
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles --project iOS/Unity-iPhone.xcodeproj

      - name: IPA derle
        run: |
          BN=$(cat iOS/BUILD_NUMBER)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" iOS/Info.plist
          xcode-project build-ipa \
            --project iOS/Unity-iPhone.xcodeproj \
            --scheme Unity-iPhone \
            --config Release

      - name: TestFlight'a yükle
        run: |
          app-store-connect publish \
            --path "$(find build/ios/ipa -name '*.ipa' | head -1)" \
            --testflight

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-and-logs
          path: |
            build/ios/ipa/*.ipa
            /tmp/xcodebuild_logs/*.log
          retention-days: 7
